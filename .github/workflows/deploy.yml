name: Deploy a cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        run: npm run build

      - name: Subir dist/ por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # La cuenta FTP ya está enjaulada en public_html, así que la raíz es "./"
          local-dir: ./dist/
          server-dir: ./
          # No borrar recursos que cPanel/AutoSSL administran fuera del build.
          exclude: |
            **/.well-known/**
            **/cgi-bin/**
